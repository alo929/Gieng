<style>
  :root{
    --bg-void:#07080d;
    --card-bg:rgba(16,18,28,0.72);
    --card-border:rgba(255,255,255,0.08);
    --ink:#eef0f8;
    --ink-dim:#8b92a8;
    --ink-faint:#565d72;
    --accent-a:#ff8fb0;
    --accent-b:#ffc98f;
    --accent-c:#c76b8b;
    --live:#3ddc84;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    background:var(--bg-void);
    font-family:'Inter', sans-serif;
    color:var(--ink);
    overflow-x:hidden;
  }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
    position:relative;
    background-image:
      linear-gradient(180deg, rgba(5,5,9,0.55) 0%, rgba(5,5,9,0.75) 100%),
      url('file:///C:/Users/truon/Downloads/background.jpg');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
  }

  /* ambient backdrop */
  .backdrop{
    position:fixed;
    inset:0;
    z-index:0;
    background:
      radial-gradient(ellipse 700px 500px at 15% 10%, rgba(255,79,184,0.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at 85% 90%, rgba(79,224,255,0.14), transparent 60%),
      var(--bg-void);
  }
  .backdrop::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size:42px 42px;
    mask-image:radial-gradient(ellipse 900px 700px at 50% 40%, black, transparent 75%);
  }

  .stage{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;
  }

  /* aura ring behind card, pulses with the equalizer */
  .aura{
    position:absolute;
    top:-30px; left:50%;
    width:340px; height:340px;
    transform:translateX(-50%);
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--accent-a), var(--accent-c), var(--accent-b), var(--accent-a));
    filter:blur(70px);
    opacity:0.35;
    z-index:-1;
    animation:auraspin 14s linear infinite, aurapulse 2.4s ease-in-out infinite;
  }
  @keyframes auraspin{ to{ transform:translateX(-50%) rotate(360deg);} }
  @keyframes aurapulse{ 0%,100%{opacity:0.28;} 50%{opacity:0.46;} }

  .card{
    position:relative;
    border-radius:22px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    overflow:hidden;
    box-shadow:0 30px 80px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.02) inset;
  }
  .card::before{
    content:"";
    position:absolute; inset:0;
    padding:1px;
    border-radius:22px;
    background:linear-gradient(135deg, rgba(255,79,184,0.5), rgba(139,107,255,0.15), rgba(79,224,255,0.5));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
  }

  /* banner */
  .banner{
    position:relative;
    height:120px;
    background-image:
      linear-gradient(180deg, rgba(10,8,10,0.15) 0%, rgba(10,8,10,0.55) 100%),
      url('github.com/alo929/bio-c-a-giang-/blob/main/sylphiette-mushoku-tensei_1.gif?raw=true');
    background-size:cover;
    background-position:center 30%;
    overflow:hidden;
  }
  .banner svg{position:absolute; inset:0; width:100%; height:100%; opacity:0.9;}
  .banner-line{
    stroke:rgba(255,255,255,0.35);
    stroke-width:1.4;
    fill:none;
    stroke-dasharray:6 300;
    animation:travel 6s linear infinite;
  }
  .banner-line:nth-child(2){ animation-delay:-2s; stroke:rgba(79,224,255,0.5);}
  .banner-line:nth-child(3){ animation-delay:-4s; stroke:rgba(255,79,184,0.5);}
  @keyframes travel{ to{ stroke-dashoffset:-620; } }

  /* header row: avatar.gif + name */
  .header{
    display:flex;
    align-items:flex-end;
    gap:16px;
    padding:0 22px;
    margin-top:-42px;
    position:relative;
    z-index:2;
  }
  .avatar-wrap{
    position:relative;
    width:84px; height:84px;
    flex-shrink:0;
  }
  .avatar-ring{
    position:absolute; inset:-4px;
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--accent-a), var(--accent-b), var(--accent-c), var(--accent-a));
    animation:auraspin 5s linear infinite;
  }
  .avatar{
    position:absolute; inset:3px;
    border-radius:50%;
    background-image:url('https://raw.githubusercontent.com/alo929/bio-c-a-giang-/refs/heads/main/mushokutensei-sylphie-sylphiette-sylphie-whitemama-lanwentuzi.gif');
    background-size:cover;
    background-position:center 20%;
    border:3px solid var(--bg-void);
    display:flex; align-items:center; justify-content:center;
    font-family:'Sora', sans-serif;
    font-weight:800;
    font-size:26px;
    color:#fff;
    overflow:hidden;
  }
  .status-dot{
    position:absolute;
    bottom:2px; right:2px;
    width:18px; height:18px;
    border-radius:50%;
    background:var(--live);
    border:3px solid #0d1018;
    box-shadow:0 0 10px rgba(61,220,132,0.7);
  }

  .name-block{
    padding-bottom:6px;
    min-width:0;
  }
  .display-name{
    font-family:'Sora', sans-serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:-0.01em;
    background:linear-gradient(90deg, #ffffff, #d8def5);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    white-space:nowrap;
  }
  .handle{
    font-size:13px;
    color:var(--ink-dim);
    margin-top:1px;
  }

  .body{
    padding:20px 22px 22px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .row{
    display:flex;
    gap:12px;
  }

  .panel{
    flex:1;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:14px;
    padding:12px 14px;
  }
  .panel-label{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.09em;
    color:var(--ink-faint);
    font-weight:600;
    margin-bottom:6px;
  }

  .status-line{
    display:flex; align-items:center; gap:7px;
    font-size:13.5px;
    font-weight:500;
  }
  .status-line .pulse-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--live);
    box-shadow:0 0 8px rgba(61,220,132,0.8);
    animation:blink 1.6s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  .clock{
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    color:var(--ink-dim);
    margin-top:4px;
  }

  .badges{ display:flex; gap:8px; margin-top:2px; flex-wrap:wrap;}
  .badge{
    width:26px; height:26px;
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-size:13px;
    background:linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border:1px solid rgba(255,255,255,0.08);
  }

  .bio-text{
    font-size:13.5px;
    line-height:1.55;
    color:#c4c9db;
  }

  .tags{ display:flex; flex-wrap:wrap; gap:7px; margin-top:12px;}
  .tag{
    font-size:11.5px;
    font-weight:500;
    padding:6px 12px;
    border-radius:999px;
    color:#d8def5;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.09);
  }
  .tag.hot{
    background:linear-gradient(90deg, rgba(255,79,184,0.18), rgba(139,107,255,0.18));
    border-color:rgba(255,79,184,0.35);
    color:#ffd6f0;
  }

  .socials{
    display:flex; justify-content:center; gap:12px;
    padding-top:4px;
  }
  .social{
    width:38px; height:38px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    color:var(--ink-dim);
    transition:transform 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    cursor:pointer;
  }
  .social:hover{
    transform:translateY(-3px);
    color:#fff;
    border-color:rgba(255,79,184,0.5);
  }
  .social svg{width:16px; height:16px;}

  .footer-tabs{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px;
    border-top:1px solid rgba(255,255,255,0.06);
    font-size:11.5px;
    color:var(--ink-faint);
  }
  .footer-tabs .center-chip{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    padding:6px 12px;
    border-radius:999px;
    color:#d8def5;
    font-weight:500;
  }

  /* now playing bar */
  .now-playing{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 16px;
    background:rgba(9,10,16,0.9);
    border-top:1px solid rgba(255,255,255,0.07);
  }
  .np-btn{
    width:30px; height:30px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--accent-a), var(--accent-c));
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    border:none;
  }
  .np-btn svg{ width:13px; height:13px; fill:#fff;}
  .np-info{ flex:1; min-width:0; }
  .np-title{
    font-size:12.5px; font-weight:600; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .np-meta{
    display:flex; justify-content:space-between;
    font-size:10.5px; color:var(--ink-faint);
    font-family:'JetBrains Mono', monospace;
    margin-top:2px;
  }
  .np-bar{
    width:100%; height:3px; border-radius:3px;
    background:rgba(255,255,255,0.08);
    margin-top:6px;
    overflow:hidden;
  }
  .np-bar-fill{
    height:100%; width:2%;
    background:linear-gradient(90deg, var(--accent-a), var(--accent-b));
    border-radius:3px;
  }
  .eq{
    display:flex; align-items:flex-end; gap:2px;
    height:16px;
    flex-shrink:0;
  }
  .eq span{
    width:3px;
    background:linear-gradient(180deg, var(--accent-b), var(--accent-a));
    border-radius:2px;
    animation:eq 0.9s ease-in-out infinite;
  }
  .eq span:nth-child(1){ animation-delay:-0.6s; }
  .eq span:nth-child(2){ animation-delay:-0.3s; }
  .eq span:nth-child(3){ animation-delay:-0.9s; }
  .eq span:nth-child(4){ animation-delay:-0.15s; }
  @keyframes eq{
    0%,100%{ height:4px; }
    50%{ height:16px; }
  }
  .eq.paused span{ animation-play-state:paused; height:4px; }

  @media (max-width:460px){
    .stage{ max-width:94vw; }
    .display-name{ font-size:18px; }
  }

  /* boot terminal intro */
  .boot-screen{
    position:fixed; inset:0;
    z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:rgba(4,4,7,0.55);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    transition:opacity 0.5s ease;
  }
  .boot-screen.hide{
    opacity:0;
    pointer-events:none;
  }
  .terminal-window{
    width:min(640px, 92vw);
    background:#0c0d12;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.09);
    box-shadow:0 40px 100px -20px rgba(0,0,0,0.8);
    overflow:hidden;
  }
  .terminal-titlebar{
    display:flex; align-items:center; gap:7px;
    padding:10px 14px;
    background:#15161e;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .terminal-dot{ width:11px; height:11px; border-radius:50%; }
  .terminal-dot.red{ background:#ff5f57; }
  .terminal-dot.yellow{ background:#febc2e; }
  .terminal-dot.green{ background:#28c840; }
  .terminal-label{
    margin-left:6px;
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--ink-faint);
  }
  .terminal-body{
    padding:24px 26px 28px;
    font-family:'JetBrains Mono', monospace;
    font-size:13.5px;
    line-height:1.8;
    color:#c9e9d2;
    min-height:340px;
  }
  .term-line{ white-space:pre-wrap; word-break:break-word; }
  .term-line .prompt{ color:var(--accent-a); }
  .term-line .ok{ color:var(--live); }
  .term-line .dim{ color:var(--ink-faint); }
  .term-cursor{
    display:inline-block;
    width:7px; height:14px;
    background:var(--accent-a);
    margin-left:2px;
    vertical-align:middle;
    animation:blink 0.9s step-end infinite;
  }
  .join-btn{
    display:none;
    width:100%;
    margin-top:14px;
    padding:11px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.12);
    background:linear-gradient(135deg, rgba(255,143,176,0.18), rgba(199,107,139,0.18));
    color:var(--ink);
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    letter-spacing:0.03em;
    cursor:pointer;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .join-btn:hover{ transform:translateY(-1px); background:linear-gradient(135deg, rgba(255,143,176,0.3), rgba(199,107,139,0.3)); }
  .join-btn.show{ display:block; }

  .stage{
    transition:opacity 0.6s ease, transform 0.6s ease;
  }
  .stage.pre-boot{
    opacity:0;
    transform:translateY(12px);
    pointer-events:none;
  }
</style>
</head>

<script>
  // live VN clock
  function tick(){
    const now = new Date();
    const vn = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Ho_Chi_Minh' }));
    const h = String(vn.getHours()).padStart(2,'0');
    const m = String(vn.getMinutes()).padStart(2,'0');
    const s = String(vn.getSeconds()).padStart(2,'0');
    document.getElementById('vnClock').textContent = 'VN ' + h + ':' + m + ':' + s;
  }
  tick();
  setInterval(tick, 1000);

  // real now-playing, powered by an <audio> element pointing at a local mp3
  const fill = document.getElementById('npFill');
  const cur = document.getElementById('npCurrent');
  const tot = document.getElementById('npTotal');
  const eq = document.getElementById('eq');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const audioEl = document.getElementById('audioEl');

  function fmt(sec){
    if(!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec/60);
    const s = String(Math.floor(sec%60)).padStart(2,'0');
    return m + ':' + s;
  }

  function setPlayingUI(isPlaying){
    eq.classList.toggle('paused', !isPlaying);
    playIcon.innerHTML = isPlaying
      ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
  }

  audioEl.addEventListener('loadedmetadata', () => {
    tot.textContent = fmt(audioEl.duration);
  });

  audioEl.addEventListener('timeupdate', () => {
    cur.textContent = fmt(audioEl.currentTime);
    fill.style.width = audioEl.duration ? (audioEl.currentTime / audioEl.duration) * 100 + '%' : '0%';
  });

  audioEl.addEventListener('play', () => setPlayingUI(true));
  audioEl.addEventListener('pause', () => setPlayingUI(false));
  audioEl.addEventListener('ended', () => setPlayingUI(false));

  audioEl.addEventListener('error', () => {
    document.getElementById('npTitle').textContent = 'Không tìm thấy file nhạc';
  });

  playBtn.addEventListener('click', () => {
    if(audioEl.paused){
      audioEl.play();
    } else {
      audioEl.pause();
    }
  });

  // some browsers block autoplay with sound until the person interacts with the page.
  // this catches the very first interaction of any kind, anywhere on the page, and starts playback.
  audioEl.play().catch(() => {
    const events = ['click', 'keydown', 'touchstart', 'pointerdown', 'scroll'];
    const handler = () => {
      audioEl.play().catch(() => {});
      events.forEach(ev => document.removeEventListener(ev, handler, true));
    };
    events.forEach(ev => document.addEventListener(ev, handler, true));
  });

  // boot terminal intro, typed line by line
  const termBody = document.getElementById('termBody');
  const bootScreen = document.getElementById('bootScreen');
  const stageEl = document.getElementById('stage');

  const bootLines = [
    { html: '<span class="prompt">𝙲:\𝚄𝚜𝚎𝚛𝚜\𝙶𝙸𝙰𝙽𝙶> 𝚠𝚑𝚘𝚊𝚖𝚒' },
    { html: 'giangdepzai.phiphai' },
    { html: '' },
    { html: '<span class="prompt">𝙲:\𝚄𝚜𝚎𝚛𝚜\𝙶𝙸𝙰𝙽𝙶> 𝚙𝚛𝚘𝚏𝚒𝚕𝚎 --𝚋𝚘𝚘𝚝' },
    { html: '<span class="ok">[𝙾𝙺]</span> 𝙻𝚘𝚊𝚍𝚒𝚗𝚐 𝚙𝚎𝚛𝚜𝚘𝚗𝚊𝚕 𝚒𝚗𝚝𝚎𝚛𝚏𝚊𝚌𝚎' },
    { html: '<span class="ok">[𝙾𝙺]</span> 𝙲𝚘𝚗𝚗𝚎𝚌𝚝𝚒𝚗𝚐 𝙳𝚒𝚜𝚌𝚘𝚛𝚍 𝚙𝚛𝚎𝚜𝚎𝚗𝚌𝚎' },
    { html: '<span class="ok">[𝙾𝙺]</span> 𝙿𝚛𝚎𝚙𝚊𝚛𝚒𝚗𝚐 𝚊𝚟𝚊𝚝𝚊𝚛 𝚍𝚎𝚌𝚘𝚛𝚊𝚝𝚒𝚘𝚗' },
    { html: '<span class="ok">[𝙾𝙺]</span> 𝙼𝚘𝚞𝚗𝚝𝚒𝚗𝚐 𝚕𝚘𝚌𝚊𝚕 𝚖𝚞𝚜𝚒𝚌 𝚏𝚒𝚕𝚎' },
    { html: '' },
    { html: '▶ ALIAS        : 𝙶𝙸𝙰𝙽𝙶' },
    { html: '▶ STYLE        : 𝙲à𝚢 𝚝𝚑𝚞ê & 𝚜𝚝𝚛𝚎𝚊𝚖𝚎𝚛' },
    { html: '▶ LOCATION     : 𝚅𝚒𝚎𝚝𝚗𝚊𝚖' },
    { html: '▶ PASSION      : 𝙶𝚎𝚗𝚜𝚑𝚒𝚗, 𝚅𝚊𝚕𝚘𝚛𝚊𝚗𝚝' },
    { html: '▶ CURRENT MODE : <span class="ok">Đang 𝚘𝚗𝚕𝚒𝚗𝚎</span>' },
    { html: '' },
    { html: '<span class="dim">Nhấn nút bên dưới để tiếp tục.</span>' }
  ];

  function typeLine(index){
    if(index >= bootLines.length){
      const btn = document.createElement('button');
      btn.className = 'join-btn';
      btn.textContent = 'Join World';
      termBody.appendChild(btn);
      requestAnimationFrame(() => btn.classList.add('show'));
      btn.addEventListener('click', enterWorld);
      return;
    }

    const lineEl = document.createElement('div');
    lineEl.className = 'term-line';
    termBody.appendChild(lineEl);

    const raw = bootLines[index].html;
    const isEmpty = raw === '';
    if(isEmpty){
      lineEl.innerHTML = '&nbsp;';
      setTimeout(() => typeLine(index + 1), 80);
      return;
    }

    // reveal char by char using a temp container so HTML tags stay intact
    const temp = document.createElement('div');
    temp.innerHTML = raw;
    const fullText = temp.textContent;
    let i = 0;
    const cursor = document.createElement('span');
    cursor.className = 'term-cursor';

    function step(){
      if(i <= fullText.length){
        lineEl.innerHTML = raw.length === fullText.length
          ? fullText.slice(0, i)
          : fullText.slice(0, i); // plain progressive text, tags applied on completion
        lineEl.appendChild(cursor);
        i++;
        setTimeout(step, 12);
      } else {
        lineEl.innerHTML = raw; // swap in the styled final version
        setTimeout(() => typeLine(index + 1), 90);
      }
    }
    step();
  }

  function enterWorld(){
    bootScreen.classList.add('hide');
    stageEl.classList.remove('pre-boot');
    audioEl.play().catch(() => {});
    setTimeout(() => { bootScreen.style.display = 'none'; }, 550);
  }

  typeLine(0);
</script>

</body>
</html>
