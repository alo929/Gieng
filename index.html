<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gianggaihihi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

:root{
    --bg-void:#07080d;
    --card-bg:rgba(16,18,28,0.08);
    --card-border:rgba(255,255,255,0.08);
    --ink:#eef0f8;
    --ink-dim:#8b92a8;
    --ink-faint:#565d72;
    --accent-a:#ff8fb0;
    --accent-b:#ffc98f;
    --accent-c:#c76b8b;
    --live:#3ddc84;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    font-family:'Inter', sans-serif;
    color:var(--ink);
    overflow-x:hidden;
  }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
    position:relative;
    background:#07080d;
  }

  /* ambient backdrop */
  .backdrop{
    position:fixed;
    inset:0;
    z-index:0;
    background:
      radial-gradient(ellipse 700px 500px at 15% 10%, rgba(255,79,184,0.12), transparent 60%),
      radial-gradient(ellipse 700px 500px at 85% 90%, rgba(79,224,255,0.1), transparent 60%);
    pointer-events:none;
  }
  .backdrop::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size:42px 42px;
    mask-image:radial-gradient(ellipse 900px 700px at 50% 40%, black, transparent 75%);
  }

  .stage{
    position:relative;
    z-index:1;
    width:100%;
    max-width:680px;
  }

  .aura{
    position:absolute;
    top:-30px; left:50%;
    width:340px; height:340px;
    transform:translateX(-50%);
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--accent-a), var(--accent-c), var(--accent-b), var(--accent-a));
    filter:blur(70px);
    opacity:0.35;
    z-index:-1;
    animation:auraspin 14s linear infinite, aurapulse 2.4s ease-in-out infinite;
  }
  @keyframes auraspin{ to{ transform:translateX(-50%) rotate(360deg);} }
  @keyframes aurapulse{ 0%,100%{opacity:0.28;} 50%{opacity:0.46;} }

.card-border-wrap{
    position:relative;
    border-radius:23px;
    padding:1.5px;
    background:transparent;
    box-shadow:0 0 30px -4px rgba(116,184,190,0.6), 0 0 70px -20px rgba(116,184,190,0.35);
}
  .card-border-wrap::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:23px;
    padding:1.5px;
    background:linear-gradient(135deg, #74b8be 0%, #a8dde0 40%, #4fa8b0 70%, #74b8be 100%);
    background-size:300% 300%;
    animation:borderShift 6s ease infinite;
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
  }
  @keyframes borderShift{
    0%  { background-position:0% 50%; }
    50% { background-position:100% 50%; }
    100%{ background-position:0% 50%; }
  }
  .card{
    position:relative;
    border-radius:22px;
    background:var(--card-bg);
    border:none;
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
    overflow:hidden;
    box-shadow:0 30px 80px -20px rgba(0,0,0,0.7);
  }

  /* banner */
  .banner{
    position:relative;
    height:120px;
    background-image:
      linear-gradient(180deg, rgba(10,8,10,0.15) 0%, rgba(10,8,10,0.55) 100%),
      url('https://raw.githubusercontent.com/alo929/Gieng/refs/heads/main/vivideo-gif-maker%20(2).gif');
    background-size:cover;
    background-position:center 30%;
    overflow:hidden;
  }

  /* header row: avatar + name */
  .header{
    display:flex;
    align-items:flex-end;
    gap:16px;
    padding:0 22px;
    margin-top:-42px;
    position:relative;
    z-index:2;
  }
  .avatar-wrap{
    position:relative;
    width:84px; height:84px;
    flex-shrink:0;
  }
  .avatar-ring{
    position:absolute; inset:-3px;
    border-radius:50%;
    background:rgba(255,255,255,0.12);
    border:2px solid rgba(255,255,255,0.18);
  }
  .avatar{
    position:absolute; inset:3px;
    border-radius:50%;
    background-image:url('https://raw.githubusercontent.com/alo929/Gieng/refs/heads/main/vivideo-gif-maker%20(1).gif');
    background-size:cover;
    background-position:center 20%;
    border:3px solid var(--bg-void);
    display:flex; align-items:center; justify-content:center;
    font-family:'Sora', sans-serif;
    font-weight:800;
    font-size:26px;
    color:#fff;
    overflow:hidden;
  }
  .status-dot{
    position:absolute;
    bottom:2px; right:2px;
    width:18px; height:18px;
    border-radius:50%;
    background:var(--live);
    border:3px solid #0d1018;
    box-shadow:0 0 10px rgba(61,220,132,0.7);
  }

  .name-block{
    padding-bottom:6px;
    min-width:0;
  }
  .display-name{
    font-family:'Sora', sans-serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:-0.01em;
    background:linear-gradient(90deg, #ffffff, #d8def5);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    white-space:nowrap;
  }
  .handle{
    font-size:13px;
    color:var(--ink-dim);
    margin-top:1px;
  }

  .body{
    padding:20px 22px 22px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .row{
    display:flex;
    gap:12px;
  }

  .panel{
    flex:1;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:14px;
    padding:12px 14px;
  }
  .panel-label{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.09em;
    color:var(--ink-faint);
    font-weight:600;
    margin-bottom:6px;
  }

  .status-line{
    display:flex; align-items:center; gap:7px;
    font-size:13.5px;
    font-weight:500;
  }
  .status-line .pulse-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--live);
    box-shadow:0 0 8px rgba(61,220,132,0.8);
    animation:blink 1.6s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  .clock{
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    color:var(--ink-dim);
    margin-top:4px;
  }

  .badges{ display:flex; gap:8px; margin-top:2px; flex-wrap:wrap;}
  .badge{
    width:26px; height:26px;
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-size:13px;
    background:linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border:1px solid rgba(255,255,255,0.08);
  }

  .bio-text{
    font-size:13.5px;
    line-height:1.55;
    color:#c4c9db;
  }

  .tags{ display:flex; flex-wrap:wrap; gap:7px; margin-top:12px;}
  .tag{
    font-size:11.5px;
    font-weight:500;
    padding:6px 12px;
    border-radius:999px;
    color:#d8def5;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.09);
  }
  .tag.hot{
    background:linear-gradient(90deg, rgba(255,79,184,0.18), rgba(139,107,255,0.18));
    border-color:rgba(255,79,184,0.35);
    color:#ffd6f0;
  }

  .socials{
    display:flex; justify-content:center; gap:12px;
    padding-top:4px;
  }
  .social{
    width:38px; height:38px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    color:var(--ink-dim);
    transition:transform 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    cursor:pointer;
    text-decoration:none;
  }
  .social:hover{
    transform:translateY(-3px);
    color:#fff;
    border-color:rgba(255,79,184,0.5);
  }
  .social svg{width:16px; height:16px;}

  .footer-tabs{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px;
    border-top:1px solid rgba(255,255,255,0.06);
    font-size:11.5px;
    color:var(--ink-faint);
  }
  .footer-tabs .center-chip{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    padding:6px 12px;
    border-radius:999px;
    color:#d8def5;
    font-weight:500;
  }

  /* now playing bar */
  .now-playing{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 16px;
    background:rgba(9,10,16,0.9);
    border-top:1px solid rgba(255,255,255,0.07);
  }
  .np-btn{
    width:30px; height:30px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--accent-a), var(--accent-c));
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    border:none;
  }
  .np-btn svg{ width:13px; height:13px; fill:#fff;}
  .np-info{ flex:1; min-width:0; }
  .np-title{
    font-size:12.5px; font-weight:600; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .np-meta{
    display:flex; justify-content:space-between;
    font-size:10.5px; color:var(--ink-faint);
    font-family:'JetBrains Mono', monospace;
    margin-top:2px;
  }
  .np-bar{
    width:100%; height:3px; border-radius:3px;
    background:rgba(255,255,255,0.08);
    margin-top:6px;
    overflow:hidden;
  }
  .np-bar-fill{
    height:100%; width:2%;
    background:linear-gradient(90deg, var(--accent-a), var(--accent-b));
    border-radius:3px;
  }
  .eq{
    display:flex; align-items:flex-end; gap:2px;
    height:16px;
    flex-shrink:0;
  }
  .eq span{
    width:3px;
    background:linear-gradient(180deg, var(--accent-b), var(--accent-a));
    border-radius:2px;
    animation:eq 0.9s ease-in-out infinite;
  }
  .eq span:nth-child(1){ animation-delay:-0.6s; }
  .eq span:nth-child(2){ animation-delay:-0.3s; }
  .eq span:nth-child(3){ animation-delay:-0.9s; }
  .eq span:nth-child(4){ animation-delay:-0.15s; }
  @keyframes eq{
    0%,100%{ height:4px; }
    50%{ height:16px; }
  }
  .eq.paused span{ animation-play-state:paused; height:4px; }

  @media (max-width:460px){
    .stage{ max-width:94vw; }
    .display-name{ font-size:18px; }
  }

  /* tilt on hover */
  .card-border-wrap{
    will-change: transform;
    transform-style: preserve-3d;
    transition: transform 0.35s ease;
  }

  /* --- STYLES MỚI: WINDOWS 11 TERMINAL --- */
  .boot-screen{
    position:fixed; inset:0;
    z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    transition:opacity 0.5s ease;
  }
  .boot-screen.hide{
    opacity:0;
    pointer-events:none;
  }
  .terminal-window{
    width:min(720px, 92vw);
    background:#0d0e12;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 35px 90px rgba(0,0,0,0.85);
    overflow:hidden;
  }
  .terminal-titlebar{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 12px 0 12px;
    background:#08090d;
    border-bottom:1px solid rgba(255,255,255,0.05);
    user-select:none;
  }
  .terminal-tab-group{
    display:flex; align-items:center; gap:8px;
  }
  .terminal-tab{
    display:flex; align-items:center; gap:10px;
    background:#12141c;
    padding:6px 16px;
    border-radius:6px 6px 0 0;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:#d0d4e4;
    border:1px solid rgba(255,255,255,0.08);
    border-bottom:none;
  }
  .tab-plus{
    color:#687088; font-size:14px; cursor:pointer; font-weight:bold;
  }
  .win-controls{
    display:flex; gap:18px;
    color:#787f95; font-size:12px; padding-bottom:6px;
  }
  .terminal-body{
    padding:24px 28px;
    font-family:'JetBrains Mono', 'Consolas', monospace;
    font-size:13px;
    line-height:1.75;
    color:#e0e3ed;
    min-height:360px;
  }
  .term-line{ white-space:pre-wrap; word-break:break-word; color:#e0e3ed; }
  .term-line .prompt{ color:#e0e3ed; }
  .term-line .ok{ color:#ffffff; }
  .term-line .dim{ color:#787f95; }
  .term-cursor{
    display:inline-block;
    width:8px; height:15px;
    background:#ffffff;
    margin-left:2px;
    vertical-align:middle;
    animation:blink 0.9s step-end infinite;
  }
  .join-btn{
    display:none;
    width:100%;
    margin-top:20px;
    padding:12px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.1);
    background:rgba(255,255,255,0.04);
    color:#eef0f8;
    font-family:'JetBrains Mono', 'Consolas', monospace;
    font-size:13px;
    letter-spacing:0.02em;
    cursor:pointer;
    transition:all 0.15s ease;
  }
  .join-btn:hover{
    background:rgba(255,255,255,0.08);
    border-color:rgba(255,255,255,0.2);
  }
  .join-btn.show{ display:block; }

  .stage{
    transition:opacity 0.6s ease, transform 0.6s ease;
  }
  .stage.pre-boot{
    opacity:0;
    transform:translateY(12px);
    pointer-events:none;
  }

  /* floating particle layer */
  .particles{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
  }
  .particle{
    position:absolute;
    bottom:-20px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,201,143,0.9), rgba(255,143,176,0.4) 60%, transparent 70%);
    filter:blur(0.5px);
    animation-name:floatUp;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:0.8; }
    90%{ opacity:0.6; }
    100%{ transform:translateY(-110vh) translateX(var(--drift, 30px)); opacity:0; }
  }

<script>
  // live VN clock
  function tick(){
    const now = new Date();
    const vn = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Ho_Chi_Minh' }));
    const h = String(vn.getHours()).padStart(2,'0');
    const m = String(vn.getMinutes()).padStart(2,'0');
    const s = String(vn.getSeconds()).padStart(2,'0');
    document.getElementById('vnClock').textContent = 'VN ' + h + ':' + m + ':' + s;
  }
  tick();
  setInterval(tick, 1000);

  // real now-playing
  const fill = document.getElementById('npFill');
  const cur = document.getElementById('npCurrent');
  const tot = document.getElementById('npTotal');
  const eq = document.getElementById('eq');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const audioEl = document.getElementById('audioEl');

  function fmt(sec){
    if(!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec/60);
    const s = String(Math.floor(sec%60)).padStart(2,'0');
    return m + ':' + s;
  }

  function setPlayingUI(isPlaying){
    eq.classList.toggle('paused', !isPlaying);
    playIcon.innerHTML = isPlaying
      ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
  }

  audioEl.addEventListener('loadedmetadata', () => {
    tot.textContent = fmt(audioEl.duration);
  });

  audioEl.addEventListener('timeupdate', () => {
    cur.textContent = fmt(audioEl.currentTime);
    fill.style.width = audioEl.duration ? (audioEl.currentTime / audioEl.duration) * 100 + '%' : '0%';
  });

  audioEl.addEventListener('play', () => setPlayingUI(true));
  audioEl.addEventListener('pause', () => setPlayingUI(false));
  audioEl.addEventListener('ended', () => setPlayingUI(false));

  audioEl.addEventListener('error', () => {
    document.getElementById('npTitle').textContent = 'Không tìm thấy file nhạc';
  });

  playBtn.addEventListener('click', () => {
    if(audioEl.paused){
      audioEl.play();
    } else {
      audioEl.pause();
    }
  });

  audioEl.play().catch(() => {
    const events = ['click', 'keydown', 'touchstart', 'pointerdown', 'scroll'];
    const handler = () => {
      audioEl.play().catch(() => {});
      events.forEach(ev => document.removeEventListener(ev, handler, true));
    };
    events.forEach(ev => document.addEventListener(ev, handler, true));
  });

  // Windows Terminal Script chuẩn theo mẫu takeshi.dev
  const termBody = document.getElementById('termBody');
  const bootScreen = document.getElementById('bootScreen');
  const stageEl = document.getElementById('stage');

  const bootLines = [
    { html: 'Microsoft Windows [Version 11.0.22631.0000]' },
    { html: '(c) Microsoft Corporation. All rights reserved.' },
    { html: '' },
    { html: 'C:\\Users\\GIANG&gt; whoami' },
    { html: 'GiangDepZai' },
    { html: '' },
    { html: 'C:\\Users\\GIANG&gt; profile --boot' },
    { html: '[OK] Loading personal interface...' },
    { html: '[OK] Connecting Discord presence...' },
    { html: '[OK] Preparing avatar decoration...' },
    { html: '[OK] Mounting local music file...' },
    { html: '' },
    { html: 'Alias        : GIANG' },
    { html: 'Style        : Cày thuê &amp; streamer' },
    { html: 'Location     : Vietnam' },
    { html: 'Passion      : Genshin, Valorant' },
    { html: 'Current Mode : Quiet but online' },
    { html: '' },
    { html: '<span class="dim">Press Enter to continue.</span>' }
  ];

  function typeLine(index){
    if(index >= bootLines.length){
      const btn = document.createElement('button');
      btn.className = 'join-btn';
      btn.textContent = 'Join World';
      termBody.appendChild(btn);
      requestAnimationFrame(() => btn.classList.add('show'));
      btn.addEventListener('click', enterWorld);
      return;
    }

    const lineEl = document.createElement('div');
    lineEl.className = 'term-line';
    termBody.appendChild(lineEl);

    const raw = bootLines[index].html;
    const isEmpty = raw === '';
    if(isEmpty){
      lineEl.innerHTML = '&nbsp;';
      setTimeout(() => typeLine(index + 1), 70);
      return;
    }

    const temp = document.createElement('div');
    temp.innerHTML = raw;
    const fullText = temp.textContent;
    let i = 0;
    const cursor = document.createElement('span');
    cursor.className = 'term-cursor';

    function step(){
      if(i <= fullText.length){
        lineEl.innerHTML = fullText.slice(0, i);
        lineEl.appendChild(cursor);
        i++;
        setTimeout(step, 10);
      } else {
        lineEl.innerHTML = raw;
        setTimeout(() => typeLine(index + 1), 70);
      }
    }
    step();
  }

  function enterWorld(){
    bootScreen.classList.add('hide');
    stageEl.classList.remove('pre-boot');
    audioEl.play().catch(() => {});
    setTimeout(() => { bootScreen.style.display = 'none'; }, 550);
  }

  typeLine(0);

  // card tilt on mousemove
  const cardWrap = document.querySelector('.card-border-wrap');
  const MAX_TILT = 8;

  cardWrap.addEventListener('mousemove', (e) => {
    const rect = cardWrap.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dx = (e.clientX - cx) / (rect.width / 2);
    const dy = (e.clientY - cy) / (rect.height / 2);
    const rotX = -dy * MAX_TILT;
    const rotY = dx * MAX_TILT;
    cardWrap.style.transition = 'none';
    cardWrap.style.transform = `perspective(900px) rotateX(${rotX}deg) rotateY(${rotY}deg) scale3d(1.012,1.012,1.012)`;
  });

  cardWrap.addEventListener('mouseleave', () => {
    cardWrap.style.transition = 'transform 0.35s ease';
    cardWrap.style.transform = 'perspective(900px) rotateX(0deg) rotateY(0deg) scale3d(1,1,1)';
  });

  // floating particle background
  const particleLayer = document.getElementById('particles');
  const particleCount = 26;
  for(let i = 0; i < particleCount; i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 3 + Math.random() * 5;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + 'vw';
    const duration = 10 + Math.random() * 14;
    p.style.animationDuration = duration + 's';
    p.style.animationDelay = (-Math.random() * duration) + 's';
    p.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
    particleLayer.appendChild(p);
  }
</script>
